spring.application.name=agent-demo

# DeepSeek when no profile is given; run Gemini with --spring.profiles.active=gemini
spring.profiles.default=gemini

# the agent's tools call the app's own REST API over HTTP, like any other client
app.api-base-url=http://localhost:${server.port:8080}

# shows every LLM round, including the tool calls inside it
logging.level.dev.langchain4j=DEBUG
