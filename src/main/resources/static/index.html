<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent demo</title>
<style>
  :root { --line: #d8dce3; --muted: #6b7280; --bg: #f6f7f9; --accent: #1f6feb; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: #111;
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { margin: 0 0 16px; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); max-width: 90ch; }
  .grid { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; align-items: start; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 10px;
           display: flex; flex-direction: column; height: 70vh; min-height: 420px; }
  .panel h2 { font-size: 13px; margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line);
              display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .panel h2 small { color: var(--muted); font-weight: 400; font-size: 11px; }
  .log { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; word-break: break-word; }
  .me { background: #eaf1ff; align-self: flex-end; max-width: 85%; }
  .bot { background: #f2f3f5; align-self: flex-start; max-width: 95%; }
  .err { background: #ffecec; color: #a11; }
  .steps { margin: 6px 0 0; padding: 6px 8px; border-left: 2px solid var(--line);
           color: var(--muted); font-size: 12px; white-space: pre-wrap; }
  form { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); margin: 0; }
  input[type=text] { flex: 1; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
                     font: inherit; }
  button { padding: 8px 14px; border: 0; border-radius: 6px; background: var(--accent); color: #fff;
           font: inherit; cursor: pointer; }
  button:disabled { background: #9db8e4; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>Agent demo</h1>
  <p>One user CRUD tool set, reached over real HTTP against <code>/api/users</code>.
     Left: a two-agent system (supervisor routing between a manager and an auditor), one blocking reply.
     Right: a single agent, streamed over SSE.</p>
</header>

<div class="grid">
  <section class="panel">
    <h2>Multi-agent &middot; blocking <small id="s1"></small></h2>
    <div class="log" id="log1"></div>
    <form id="form1">
      <input type="text" id="in1" placeholder="create 3 users then verify them" autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </section>

  <section class="panel">
    <h2>Single agent &middot; SSE streaming <small id="s2"></small></h2>
    <div class="log" id="log2"></div>
    <form id="form2">
      <input type="text" id="in2" placeholder="list every user" autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </section>
</div>

<script>
const panels = {
  1: { log: document.getElementById('log1'), input: document.getElementById('in1'),
       form: document.getElementById('form1'), session: crypto.randomUUID(),
       sid: document.getElementById('s1') },
  2: { log: document.getElementById('log2'), input: document.getElementById('in2'),
       form: document.getElementById('form2'), session: crypto.randomUUID(),
       sid: document.getElementById('s2') }
};
for (const p of Object.values(panels)) p.sid.textContent = 'session ' + p.session.slice(0, 8);

function bubble(panel, text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + (cls || 'bot');
  div.textContent = text;
  panel.log.appendChild(div);
  panel.log.scrollTop = panel.log.scrollHeight;
  return div;
}

function busy(panel, isBusy) {
  panel.form.querySelector('button').disabled = isBusy;
  panel.input.disabled = isBusy;
  if (!isBusy) panel.input.focus();
}

// Panel 1 — multi-agent, one blocking reply, plus the routing trace
panels[1].form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const panel = panels[1];
  const message = panel.input.value.trim();
  if (!message) return;
  panel.input.value = '';
  bubble(panel, message, 'me');
  busy(panel, true);
  try {
    const res = await fetch('/api/multi-agent/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: panel.session, message })
    });
    const data = await res.json();
    const reply = bubble(panel, data.reply || '(no content)');
    if (data.steps && data.steps.length) {
      const steps = document.createElement('div');
      steps.className = 'steps';
      steps.textContent = data.steps.map(s => '-> ' + s.agent + ': ' + s.output).join('\n');
      reply.appendChild(steps);
    }
    if (data.error) bubble(panel, data.error, 'err');
  } catch (err) {
    bubble(panel, 'Error: ' + err.message, 'err');
  } finally {
    busy(panel, false);
  }
});

// Panel 2 — single agent over SSE
panels[2].form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const panel = panels[2];
  const message = panel.input.value.trim();
  if (!message) return;
  panel.input.value = '';
  bubble(panel, message, 'me');
  busy(panel, true);
  const reply = bubble(panel, '');
  try {
    const res = await fetch('/api/agent/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: panel.session, message })
    });
    if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      // frames are separated by a blank line; keep the trailing partial frame buffered
      const frames = buffer.split('\n\n');
      buffer = frames.pop();
      for (const frame of frames) {
        // one event may carry several data: lines — join them. Spring writes the value
        // verbatim after "data:" with no separator space, so nothing may be trimmed here:
        // a token like " fetch" arrives as "data: fetch" and that space is part of the text
        const chunk = frame.split('\n')
          .filter(line => line.startsWith('data:'))
          .map(line => line.slice(5))
          .join('\n');
        if (chunk) reply.textContent += chunk;
      }
      panel.log.scrollTop = panel.log.scrollHeight;
    }
    if (!reply.textContent) reply.textContent = '(no content)';
  } catch (err) {
    bubble(panel, 'Error: ' + err.message, 'err');
  } finally {
    busy(panel, false);
  }
});

panels[1].input.focus();
</script>
</body>
</html>
